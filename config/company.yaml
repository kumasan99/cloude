# 会社の前提情報。クロ（COO）が毎回のレポートで参照します。
# 空欄のままでも動きますが、埋めるほど報告の精度が上がります。
company:
  name: ""                # 例: 株式会社リソウ
  business: ""            # 例: 中小企業向けの業務システム受託開発
  founded: ""             # 例: 2018
  fiscal_year_end: ""     # 例: 3月
  employees: 0            # 正社員数
  contractors: 0          # 業務委託・パート等

ceo:
  name: ""
  # CEOが今いちばん気にしていること。ここを書き換えると報告の切り口が変わります。
  priorities:
    - "資金繰りを止めないこと"
    - "利益率の改善"
    - "属人化の解消"
  # 「これは自分が決める」と決めている領域（=decisions に上げてほしいもの）
  decision_scope:
    - "100万円以上の支出"
    - "採用・解雇"
    - "新規事業・撤退"
    - "主要顧客との条件変更"

reporting:
  cadence: "weekly"        # weekly / monthly
  tone: "率直に。悪い数字ほど先に。"
