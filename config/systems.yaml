# ReSowグループ 利用システム台帳（クロが把握・監視する対象）
# status: connected=クロが直接読める / drive=Drive経由で読める / indirect=他システム経由で把握 / none=未連携
# クロは四半期ごとに各社の公式MCP提供状況を再確認し、直結できるようになり次第提案する。

systems:
  - name: マネーフォワード クラウド会計
    role: 会計（全5社）
    status: connected
    via: 公式リモートMCP（1接続=1事業者。月次の切替週間で全社巡回）
    note: 月次PL/BS/仕訳/取引先。スナップショットをDriveへ書き出し

  - name: バクラク
    role: 経費精算・請求書処理・法人カード（LayerX）
    status: indirect
    via: 仕訳としてMFに流れるため、経費の実額はMF経由で把握可能
    note: >
      公式MCPは未提供（2026-08時点。LayerXはMCPに積極的なため提供されれば即接続）。
      申請・承認の状況（承認待ち件数、差戻し、支払予定）はMFに乗らないため、
      必要になったら月次CSVエクスポート→Drive で補完する。
      議事録より：payment業務をM&Tから社内移行中／8月から事前承認制度を運用開始。
      この移行の定着状況はクロの監視対象。

  - name: Sansan
    role: 名刺管理・人脈データ
    status: none
    via: 未連携（公式MCPなし。APIは契約プラン依存）
    note: >
      経営ダッシュボード上の優先度は低。ただしFC営業の属人化解消（FC商品再設計）や
      金融機関・行政の接点管理で使う局面が来たら、CSVエクスポート→Drive を検討。

  - name: Teachme Biz
    role: マニュアル・手順書（松下さん主導・6ヶ月計画）
    status: none
    via: 未連携（公式MCPなし）
    note: >
      属人化解消KPIの進捗源。マニュアル作成本数・閲覧状況の管理レポートを
      月次でDriveに置いてもらえれば、改善提案の進捗として追跡する。

  - name: Plaud
    role: 会議録音・文字起こし
    status: connected
    via: 公式MCP
    note: 経営系の録音のみ参照可。個人の人事・処遇はCEO明示指示時のみ（ルール承認待ち）

  - name: Google Drive / Docs / Sheets
    role: 文書・データの保管（00.ReSow参謀AI）
    status: connected
    via: 公式MCP
    note: 台帳は ReSow_00_MAP_v3

  - name: Gmail / Google Calendar
    role: メール・予定
    status: connected
    via: 公式MCP
    note: 現在はダッシュボード未使用。督促・期日管理に使う構想はPhase 2で判断

  - name: かんりくん
    role: （用途確認中）
    status: none
    via: 未連携
    note: 議事録で「継続について協議」中。継続判断が出たら役割と連携要否を確認
